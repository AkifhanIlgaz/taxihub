version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: taxihub-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taxihub
      MONGO_INITDB_ROOT_USERNAME: taxihub
      MONGO_INITDB_ROOT_PASSWORD: taxihubpass
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db. adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  driver-service:
    build:
      context: .
      dockerfile: driver-service/Dockerfile
    container_name: taxihub-driver-service
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: taxihub-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - driver-service
    restart: unless-stopped

volumes:
  mongo-data:
