syntax = "proto3";

package driver;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AkifhanIlgaz/taxihub/common/genproto/driver";

// Driver Service
service DriverService {
  rpc AddDriver(AddDriverRequest) returns (AddDriverResponse);
  rpc UpdateDriver(UpdateDriverRequest) returns (UpdateDriverResponse);
  rpc GetDrivers(GetDriversRequest) returns (GetDriversResponse);
  rpc GetNearbyDrivers(GetNearbyDriversRequest) returns (GetNearbyDriversResponse);
}

// Messages
message Driver {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string plate = 4;
  string taxi_type = 5;
  string car_brand = 6;
  string car_model = 7;
  double latitude = 8;
  double longitude = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message AddDriverRequest {
  string first_name = 1;
  string last_name = 2;
  string plate = 3;
  string taxi_type = 4;
  string car_model = 5;
  string car_brand = 6;
  double latitude = 7;
  double longitude = 8;
}

message AddDriverResponse {
  string id = 1;
}

message UpdateDriverRequest {
  string id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string plate = 4;
  optional string taxi_type = 5;
  optional string car_model = 6;
  optional string car_brand = 7;
  optional double latitude = 8;
  optional double longitude = 9;
}

message UpdateDriverResponse {
  string message = 1;
}

message GetDriversRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message Metadata {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_count = 3;
  int64 total_pages = 4;
}

message GetDriversResponse {
  repeated Driver drivers = 1;
  Metadata meta = 2;
}

message GetNearbyDriversRequest {
  double latitude = 1;
  double longitude = 2;
  string taxi_type = 3;
}

message NearbyDriver {
  string first_name = 1;
  string last_name = 2;
  string plate = 3;
  double distance_km = 4;
}

message GetNearbyDriversResponse {
  repeated NearbyDriver drivers = 1;
}
